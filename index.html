<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>無盡原野 - 探索原型</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff3dc;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
      outline: none;
    }
    #hint {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      border-radius: 14px;
      background: rgba(30, 40, 50, 0.55);
      color: #fff;
      text-align: center;
      pointer-events: none;
      user-select: none;
      line-height: 1.6;
    }
    #hint strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }
    #hint span {
      font-size: 13px;
      opacity: 0.85;
    }
    #hint[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="hint" hidden>
    <strong>點擊畫面開始</strong>
    <span>WASD 移動 · Shift 跑步 · 空白鍵 跳躍<br>滑鼠 轉視角 · 滾輪 縮放 · Esc 顯示滑鼠</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/math/SimplexNoise.js"></script>
  <script>
    const CONFIG = {
      chunkSize: 48,
      chunkSegments: 32,
      loadRadius: 3,
      unloadRadius: 5,
      detailRadius: 2,
      chunksPerFrame: 1,
      lookAheadSeconds: 1.5,
      decorSpacing: 4,
      shadowChunkRadius: 1,
      shadowExtent: 36,
      shadowMapSize: 2048,
      fogNear: 60,
      fogFar: 140,
      waterLevel: -3.5,
      swimDepth: 1.25,
      swimSpeedFactor: 0.5,
      physicsStep: 1 / 120,
      gravity: 28,
      walkSpeed: 4.2,
      runSpeed: 8.5,
      groundAccel: 45,
      airAccel: 12,
      jumpSpeed: 9,
      coyoteTime: 0.1,
      jumpBufferTime: 0.12,
      groundSnap: 0.35,
      stepUp: 0.5,
      playerRadius: 0.35,
      camFocusHeight: 1.5,
      camMinDistance: 2.5,
      camMaxDistance: 14,
      camMinPitch: -0.3,
      camMaxPitch: 1.35,
      camClearance: 0.45,
      mouseSensitivity: 0.0022,
      butterflyCount: 18,
      cloudCount: 16,
    };

    const SUN_DIRECTION = new THREE.Vector3(0.55, 0.72, 0.4).normalize();
    const UP = new THREE.Vector3(0, 1, 0);
    const BIOME = { MEADOW: 0, FOREST: 1, TAIGA: 2, SNOW: 3, SAVANNA: 4, DESERT: 5 };

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hash2(x, z, seed) {
      let h = Math.imul(seed ^ x, 0x85ebca6b);
      h ^= h >>> 13;
      h = Math.imul(h ^ z, 0xc2b2ae35);
      h ^= h >>> 16;
      h = Math.imul(h, 0x27d4eb2f);
      h ^= h >>> 15;
      return h >>> 0;
    }

    function smoothstep(a, b, x) {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function clamp01(x) {
      return Math.min(1, Math.max(0, x));
    }

    function damp(current, target, lambda, dt) {
      return target + (current - target) * Math.exp(-lambda * dt);
    }

    function readSeed() {
      const value = parseInt(new URLSearchParams(location.search).get('seed'), 10);
      return Number.isFinite(value) ? value >>> 0 : (Math.random() * 0xffffffff) >>> 0;
    }

    const WORLD_SEED = readSeed();

    const Terrain = (() => {
      const simplex = new THREE.SimplexNoise({ random: mulberry32(WORLD_SEED) });
      const cell = CONFIG.chunkSize / CONFIG.chunkSegments;
      const c = (hex) => new THREE.Color(hex);
      const groundPalette = {
        [BIOME.MEADOW]: [c(0x9fcc6b), c(0x7fba5c), c(0x8cc262)],
        [BIOME.FOREST]: [c(0x6ea856), c(0x5f9a4a), c(0x548c43)],
        [BIOME.TAIGA]: [c(0x7f9c5e), c(0x6f8e56), c(0x88a468)],
        [BIOME.SNOW]: [c(0xf2f5f7), c(0xe4edf2), c(0xf8f8f4)],
        [BIOME.SAVANNA]: [c(0xcdc36b), c(0xbdb35f), c(0xd6cc7c)],
        [BIOME.DESERT]: [c(0xecd49a), c(0xe2c687), c(0xf2dea8)],
      };
      const special = {
        seabed: c(0xc9b98a),
        beach: c(0xe8d9a2),
        dirt: c(0xb39a6b),
        rock: c(0xa29d95),
        coldRock: c(0x98a2a8),
        sandstone: c(0xcf9a66),
      };

      function noise(x, z) {
        return simplex.noise(x, z);
      }

      function fbm(x, z, octaves) {
        let sum = 0;
        let amp = 1;
        let freq = 1;
        let norm = 0;
        for (let i = 0; i < octaves; i++) {
          sum += simplex.noise(x * freq, z * freq) * amp;
          norm += amp;
          amp *= 0.5;
          freq *= 2.03;
        }
        return sum / norm;
      }

      function sampleHeight(x, z) {
        const hills = smoothstep(-0.3, 0.6, simplex.noise(x * 0.0022 + 31.7, z * 0.0022 - 12.3));
        const broad = simplex.noise(x * 0.005, z * 0.005) * 7;
        const detail = fbm(x * 0.018, z * 0.018, 4) * (1.5 + 10 * hills);
        const ridge = 1 - Math.abs(simplex.noise(x * 0.009 + 50, z * 0.009 + 50));
        const lake = smoothstep(0.35, 0.7, simplex.noise(x * 0.0045 - 210, z * 0.0045 + 95)) * (1 - hills);
        return broad + detail + ridge * ridge * ridge * 28 * hills * hills - lake * 9;
      }

      function surfaceAt(x, z, out) {
        const ix = Math.floor(x / cell);
        const iz = Math.floor(z / cell);
        const fx = x / cell - ix;
        const fz = z / cell - iz;
        const x0 = ix * cell;
        const z0 = iz * cell;
        const h00 = sampleHeight(x0, z0);
        const h11 = sampleHeight(x0 + cell, z0 + cell);
        let dx;
        let dz;
        if (fx >= fz) {
          const h10 = sampleHeight(x0 + cell, z0);
          dx = h10 - h00;
          dz = h11 - h10;
        } else {
          const h01 = sampleHeight(x0, z0 + cell);
          dx = h11 - h01;
          dz = h01 - h00;
        }
        out.height = h00 + dx * fx + dz * fz;
        out.normalY = cell / Math.hypot(dx, cell, dz);
        return out;
      }

      const scratch = { height: 0, normalY: 1 };

      function heightAt(x, z) {
        return surfaceAt(x, z, scratch).height;
      }

      function biomeAt(x, z, height) {
        const jitter = simplex.noise(x * 0.05, z * 0.05) * 0.05;
        const temp = simplex.noise(x * 0.0014 + 500, z * 0.0014 + 500) - Math.max(0, height - 8) * 0.02 + jitter;
        const moist = simplex.noise(x * 0.0017 - 700, z * 0.0017 + 300) - jitter;
        if (temp < -0.5) return BIOME.SNOW;
        if (temp < -0.22) return BIOME.TAIGA;
        if (temp > 0.3 && moist < -0.05) return BIOME.DESERT;
        if (temp > 0.12 && moist < 0.12) return BIOME.SAVANNA;
        if (moist > 0.18) return BIOME.FOREST;
        return BIOME.MEADOW;
      }

      function colorAt(x, z, height, normalY, out) {
        const biome = biomeAt(x, z, height);
        const noiseValue = hash2(Math.floor(x * 4), Math.floor(z * 4), WORLD_SEED) / 4294967296 - 0.5;
        const arid = biome === BIOME.DESERT || biome === BIOME.SAVANNA;
        if (height < CONFIG.waterLevel - 0.3) out.copy(special.seabed);
        else if (height < CONFIG.waterLevel + 0.7 && biome !== BIOME.SNOW) out.copy(special.beach);
        else if (normalY < 0.68) out.copy(arid ? special.sandstone : biome === BIOME.SNOW ? special.coldRock : special.rock);
        else if (normalY < 0.78 && !arid && biome !== BIOME.SNOW) out.copy(special.dirt);
        else {
          const patch = simplex.noise(x * 0.03 + 400, z * 0.03 - 400) + noiseValue * 0.3;
          const colors = groundPalette[biome];
          out.copy(colors[patch > 0.35 ? 0 : patch < -0.35 ? 2 : 1]);
        }
        return out.offsetHSL(0, 0, noiseValue * 0.07);
      }

      return { cell, noise, sampleHeight, surfaceAt, heightAt, biomeAt, colorAt };
    })();

    function createGradientMap(renderer) {
      const steps = new Uint8Array([95, 175, 240]);
      const format = renderer.capabilities.isWebGL2 ? THREE.RedFormat : THREE.LuminanceFormat;
      const texture = new THREE.DataTexture(steps, steps.length, 1, format);
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;
      texture.generateMipmaps = false;
      texture.needsUpdate = true;
      return texture;
    }

    const wind = { value: 0 };

    function addWind(material) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uWindTime = wind;
        shader.vertexShader = 'attribute float sway;\nuniform float uWindTime;\n' + shader.vertexShader.replace(
          '#include <begin_vertex>',
          `#include <begin_vertex>
          #ifdef USE_INSTANCING
            float windPhase = instanceMatrix[3].x * 0.21 + instanceMatrix[3].z * 0.17;
          #else
            float windPhase = 0.0;
          #endif
          transformed.x += sin(uWindTime * 1.7 + windPhase) * sway * 0.12;
          transformed.z += cos(uWindTime * 1.3 + windPhase * 1.3) * sway * 0.08;`
        );
      };
      return material;
    }

    function createMaterials(gradientMap) {
      const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
      return {
        gradientMap,
        toon,
        terrain: toon(0xffffff, { vertexColors: true }),
        decor: addWind(toon(0xffffff, { vertexColors: true })),
        decorDepth: addWind(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking })),
        water: toon(0x4cb0d6, { transparent: true, opacity: 0.8 }),
        cloud: toon(0xffffff, { fog: false }),
      };
    }

    function flatShaded(geometry) {
      const result = geometry.index ? geometry.toNonIndexed() : geometry;
      result.computeVertexNormals();
      return result;
    }

    function jitterVertices(geometry, seed, min, max) {
      const position = geometry.attributes.position;
      const rng = mulberry32(seed);
      const offsets = new Map();
      for (let i = 0; i < position.count; i++) {
        const key = [position.getX(i), position.getY(i), position.getZ(i)].map((v) => v.toFixed(3)).join(',');
        if (!offsets.has(key)) offsets.set(key, min + rng() * (max - min));
        const s = offsets.get(key);
        position.setXYZ(i, position.getX(i) * s, position.getY(i) * s, position.getZ(i) * s);
      }
      return geometry;
    }

    const Models = (() => {
      function part(geometry, color, swayFn = null) {
        const g = geometry.index ? geometry.toNonIndexed() : geometry;
        if (g.attributes.uv) g.deleteAttribute('uv');
        g.computeVertexNormals();
        const position = g.attributes.position;
        const col = new THREE.Color(color);
        const colors = new Float32Array(position.count * 3);
        const sway = new Float32Array(position.count);
        for (let i = 0; i < position.count; i++) {
          colors[i * 3] = col.r;
          colors[i * 3 + 1] = col.g;
          colors[i * 3 + 2] = col.b;
          sway[i] = swayFn ? swayFn(position.getY(i)) : 0;
        }
        g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        g.setAttribute('sway', new THREE.BufferAttribute(sway, 1));
        return g;
      }

      function merge(parts) {
        const out = new THREE.BufferGeometry();
        const total = parts.reduce((sum, p) => sum + p.attributes.position.count, 0);
        for (const [name, size] of [['position', 3], ['normal', 3], ['color', 3], ['sway', 1]]) {
          const array = new Float32Array(total * size);
          let offset = 0;
          for (const p of parts) {
            array.set(p.attributes[name].array, offset);
            offset += p.attributes[name].array.length;
          }
          out.setAttribute(name, new THREE.BufferAttribute(array, size));
        }
        return out;
      }

      const canopySway = (y) => smoothstep(1.0, 4.5, y);
      const tipSway = (height) => (y) => clamp01(y / height);
      const cyl = (rt, rb, h, seg) => new THREE.CylinderGeometry(rt, rb, h, seg);
      const cone = (r, h, seg) => new THREE.ConeGeometry(r, h, seg);
      const ico = (r) => new THREE.IcosahedronGeometry(r, 0);

      function pine(snowy) {
        const parts = [part(cyl(0.12, 0.18, 1.3, 6).translate(0, 0.65, 0), 0x7a5536)];
        const tiers = [[1.35, 1.7, 1.75, 0x3f7d4f], [1.05, 1.5, 2.65, 0x4a8a57], [0.72, 1.3, 3.5, 0x55975f]];
        tiers.forEach(([r, h, y, color], i) => {
          parts.push(part(cone(r, h, 7).rotateY(i * 0.45).translate(0, y, 0), color, canopySway));
          if (snowy) parts.push(part(cone(r * 0.72, h * 0.42, 7).rotateY(i * 0.45).translate(0, y + h * 0.3, 0), 0xf4f7f8, canopySway));
        });
        return merge(parts);
      }

      function broadleaf() {
        return merge([
          part(cyl(0.14, 0.22, 2.0, 6).translate(0, 1.0, 0), 0x7d5a3c),
          part(cyl(0.05, 0.08, 0.9, 5).rotateZ(-0.9).translate(0.42, 1.75, 0), 0x7d5a3c),
          part(ico(1.25).translate(0, 2.9, 0), 0x6fae50, canopySway),
          part(ico(0.95).translate(0.85, 2.5, 0.25), 0x7cba58, canopySway),
          part(ico(0.9).translate(-0.7, 2.6, -0.35), 0x65a24a, canopySway),
          part(ico(0.8).translate(0.15, 3.6, -0.2), 0x84c25e, canopySway),
        ]);
      }

      function birch() {
        const parts = [part(cyl(0.09, 0.13, 3.4, 6).translate(0, 1.7, 0), 0xeeeae0)];
        [0.5, 1.1, 1.6, 2.3, 2.9].forEach((y, i) => {
          parts.push(part(cyl(0.1 + (3.4 - y) * 0.012, 0.1 + (3.4 - y) * 0.012, 0.07, 6).rotateY(i).translate(0, y, 0), 0x3b3a36));
        });
        parts.push(part(ico(0.85).scale(1, 1.35, 1).translate(0, 3.5, 0), 0xa3cf55, canopySway));
        parts.push(part(ico(0.62).scale(1, 1.2, 1).translate(0.4, 2.9, 0.2), 0xb3d862, canopySway));
        parts.push(part(ico(0.55).scale(1, 1.2, 1).translate(-0.35, 3.0, -0.2), 0x98c64c, canopySway));
        return merge(parts);
      }

      function acacia() {
        return merge([
          part(cyl(0.1, 0.18, 2.6, 5).rotateZ(0.12).translate(-0.15, 1.3, 0), 0x6e5238),
          part(cyl(0.05, 0.08, 1.2, 5).rotateZ(-0.8).translate(0.35, 2.55, 0.1), 0x6e5238),
          part(cyl(0.05, 0.08, 1.1, 5).rotateZ(0.9).rotateY(1.2).translate(-0.4, 2.6, -0.3), 0x6e5238),
          part(cyl(2.0, 1.5, 0.45, 8).translate(0, 3.0, 0), 0x8fa04a, canopySway),
          part(cyl(1.3, 1.0, 0.35, 7).translate(0.9, 3.3, 0.35), 0x9fae55, canopySway),
          part(cyl(1.1, 0.9, 0.3, 7).translate(-0.9, 3.25, -0.4), 0x869a44, canopySway),
        ]);
      }

      function cactus() {
        const green = 0x5d9b4f;
        return merge([
          part(cyl(0.28, 0.32, 2.2, 7).translate(0, 1.1, 0), green),
          part(ico(0.29).scale(1, 0.7, 1).translate(0, 2.2, 0), 0x6aa85a),
          part(cyl(0.13, 0.13, 0.5, 6).rotateZ(Math.PI / 2).translate(0.42, 1.0, 0), green),
          part(cyl(0.14, 0.14, 0.8, 6).translate(0.65, 1.35, 0), green),
          part(cyl(0.12, 0.12, 0.4, 6).rotateZ(Math.PI / 2).translate(-0.38, 1.35, 0), green),
          part(cyl(0.13, 0.13, 0.6, 6).translate(-0.55, 1.6, 0), green),
          part(ico(0.1).translate(0, 2.42, 0), 0xf06a8a),
        ]);
      }

      function bush(berries) {
        const parts = [
          part(ico(0.62).translate(0, 0.5, 0), 0x5f9e48, tipSway(3)),
          part(ico(0.48).translate(0.48, 0.38, 0.12), 0x6aa84f, tipSway(3)),
          part(ico(0.44).translate(-0.4, 0.36, -0.2), 0x578f42, tipSway(3)),
          part(ico(0.38).translate(0.05, 0.35, 0.5), 0x64a24c, tipSway(3)),
        ];
        if (berries) {
          [[0.3, 0.85, 0.35], [-0.35, 0.7, 0.3], [0.55, 0.55, 0.4], [-0.1, 0.95, -0.3], [0.2, 0.6, -0.5], [-0.6, 0.5, 0.05]].forEach(([x, y, z]) => {
            parts.push(part(ico(0.08).translate(x, y, z), 0xd8363c, tipSway(3)));
          });
        }
        return merge(parts);
      }

      function deadBush() {
        const parts = [];
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          parts.push(part(cyl(0.02, 0.045, 0.8, 3).translate(0, 0.4, 0).rotateZ(0.5 + (i % 2) * 0.25).rotateY(a), 0x8b7355, tipSway(1.5)));
        }
        return merge(parts);
      }

      function grassTuft(color, height, blades) {
        const parts = [];
        const rng = mulberry32(99 + blades);
        for (let i = 0; i < blades; i++) {
          const a = rng() * Math.PI * 2;
          const r = rng() * 0.25;
          parts.push(part(
            cone(0.05, height * (0.7 + rng() * 0.5), 3).translate(0, height * 0.45, 0).rotateZ((rng() - 0.5) * 0.6).rotateX((rng() - 0.5) * 0.6).translate(Math.cos(a) * r, 0, Math.sin(a) * r),
            color,
            tipSway(height)
          ));
        }
        return merge(parts);
      }

      function fern() {
        const parts = [];
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2;
          parts.push(part(cone(0.12, 0.9, 3).scale(1, 1, 0.3).translate(0, 0.45, 0).rotateX(0.95).rotateY(a), i % 2 ? 0x4d8f3f : 0x5aa049, tipSway(0.8)));
        }
        return merge(parts);
      }

      function flowers(colors) {
        const parts = [];
        const rng = mulberry32(colors[0]);
        for (let i = 0; i < 7; i++) {
          const x = (rng() - 0.5) * 1.3;
          const z = (rng() - 0.5) * 1.3;
          const h = 0.25 + rng() * 0.2;
          parts.push(part(cyl(0.015, 0.02, h, 3).translate(x, h / 2, z), 0x5a9a3f, tipSway(0.5)));
          parts.push(part(new THREE.OctahedronGeometry(0.09, 0).scale(1, 0.5, 1).translate(x, h + 0.02, z), colors[i % colors.length], tipSway(0.5)));
          parts.push(part(new THREE.OctahedronGeometry(0.035, 0).translate(x, h + 0.06, z), 0xffe066, tipSway(0.5)));
        }
        return merge(parts);
      }

      function mushrooms() {
        const parts = [];
        [[0, 0, 1, 0xd8453b], [0.25, 0.15, 0.7, 0xd8453b], [-0.2, 0.2, 0.55, 0xb7784a]].forEach(([x, z, s, capColor]) => {
          parts.push(part(cyl(0.05 * s, 0.07 * s, 0.24 * s, 6).translate(x, 0.12 * s, z), 0xf1e6cf));
          parts.push(part(new THREE.SphereGeometry(0.17 * s, 7, 3, 0, Math.PI * 2, 0, Math.PI / 2).translate(x, 0.22 * s, z), capColor));
          if (capColor === 0xd8453b) {
            parts.push(part(ico(0.025 * s).translate(x + 0.06 * s, 0.36 * s, z), 0xffffff));
            parts.push(part(ico(0.02 * s).translate(x - 0.05 * s, 0.34 * s, z + 0.06 * s), 0xffffff));
          }
        });
        return merge(parts);
      }

      function reeds() {
        const parts = [];
        const rng = mulberry32(7);
        for (let i = 0; i < 7; i++) {
          const x = (rng() - 0.5) * 0.7;
          const z = (rng() - 0.5) * 0.7;
          const h = 1.0 + rng() * 0.6;
          parts.push(part(cyl(0.015, 0.03, h, 3).translate(x, h / 2, z), 0x7a9a4a, tipSway(1.6)));
          if (i % 2 === 0) parts.push(part(cyl(0.045, 0.045, 0.22, 5).translate(x, h - 0.05, z), 0x6b4a2e, tipSway(1.6)));
        }
        return merge(parts);
      }

      function log() {
        return merge([
          part(cyl(0.3, 0.3, 3.0, 7).rotateZ(Math.PI / 2).translate(0, 0.28, 0), 0x7d5a3c),
          part(cyl(0.26, 0.26, 3.02, 7).rotateZ(Math.PI / 2).translate(0, 0.28, 0), 0xc9a878),
          part(cyl(0.06, 0.09, 0.5, 5).rotateX(-0.6).translate(0.6, 0.55, 0.15), 0x7d5a3c),
          part(new THREE.BoxGeometry(1.4, 0.06, 0.34).translate(-0.3, 0.57, 0), 0x6e9e45),
        ]);
      }

      function rock(snowy) {
        const parts = [part(jitterVertices(new THREE.DodecahedronGeometry(1, 0), 1234, 0.75, 1.2), 0xa7a39b)];
        if (snowy) parts.push(part(jitterVertices(ico(0.8), 55, 0.85, 1.1).scale(1, 0.35, 1).translate(0, 0.72, 0), 0xf4f7f8));
        return merge(parts);
      }

      function pebbles() {
        const rng = mulberry32(31);
        const parts = [];
        for (let i = 0; i < 5; i++) {
          const s = 0.12 + rng() * 0.18;
          parts.push(part(jitterVertices(new THREE.DodecahedronGeometry(s, 0), 40 + i, 0.8, 1.2).scale(1, 0.6, 1).translate((rng() - 0.5) * 1.2, s * 0.3, (rng() - 0.5) * 1.2), 0x9d988f));
        }
        return merge(parts);
      }

      function cloud(seed) {
        const rng = mulberry32(seed);
        const parts = [];
        const count = 4 + Math.floor(rng() * 3);
        for (let i = 0; i < count; i++) {
          const r = 3 + rng() * 4;
          parts.push(part(ico(r).scale(1, 0.6, 1).translate((i - count / 2) * 4 + rng() * 2, rng() * 2, (rng() - 0.5) * 5), 0xffffff));
        }
        return merge(parts);
      }

      return { part, merge, pine, broadleaf, birch, acacia, cactus, bush, deadBush, grassTuft, fern, flowers, mushrooms, reeds, log, rock, pebbles, cloud };
    })();

    const BIOME_DECOR = {
      [BIOME.MEADOW]: [['grass', 0.26], ['flowersWarm', 0.09], ['flowersCool', 0.08], ['bush', 0.04], ['berryBush', 0.02], ['broadleaf', 0.035], ['birch', 0.02], ['rock', 0.02], ['boulder', 0.006], ['pebbles', 0.03]],
      [BIOME.FOREST]: [['broadleaf', 0.2], ['birch', 0.07], ['pine', 0.03], ['bush', 0.07], ['berryBush', 0.03], ['mushrooms', 0.06], ['fern', 0.16], ['log', 0.02], ['rock', 0.025]],
      [BIOME.TAIGA]: [['pine', 0.24], ['rock', 0.05], ['boulder', 0.012], ['bush', 0.03], ['fern', 0.06], ['grass', 0.08], ['log', 0.02], ['mushrooms', 0.025]],
      [BIOME.SNOW]: [['snowPine', 0.1], ['snowRock', 0.06], ['pebbles', 0.02]],

    function createSky() {
      const canvas = document.createElement('canvas');
      canvas.width = 2;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#6ec3ec');
      gradient.addColorStop(0.3, '#9fd8f2');
      gradient.addColorStop(0.47, '#e4f2ee');
      gradient.addColorStop(0.5, '#fff3dc');
      gradient.addColorStop(1, '#fff3dc');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const texture = new THREE.CanvasTexture(canvas);
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(900, 24, 16),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide, fog: false, depthWrite: false })
      );
      sky.renderOrder = -1;
      sky.frustumCulled = false;
      return sky;
    }

    function createWater(material) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(360, 360).rotateX(-Math.PI / 2), material);
      mesh.position.y = CONFIG.waterLevel;
      mesh.receiveShadow = true;
      return {
        mesh,
        follow(center) {
          mesh.position.x = Math.round(center.x);
          mesh.position.z = Math.round(center.z);
        },
      };
    }

    function createLights(scene) {
      const ambient = new THREE.AmbientLight(0xbfe4ff, 0.42);
      scene.add(ambient);

      const sun = new THREE.DirectionalLight(0xffe0a3, 0.78);
      sun.castShadow = true;
      sun.shadow.mapSize.set(CONFIG.shadowMapSize, CONFIG.shadowMapSize);
      const cam = sun.shadow.camera;
      cam.left = -CONFIG.shadowExtent;
      cam.right = CONFIG.shadowExtent;
      cam.top = CONFIG.shadowExtent;
      cam.bottom = -CONFIG.shadowExtent;
      cam.near = 1;
      cam.far = 220;
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.03;
      scene.add(sun, sun.target);

      const right = new THREE.Vector3().crossVectors(UP, SUN_DIRECTION).normalize();
      const up = new THREE.Vector3().crossVectors(SUN_DIRECTION, right);
      const texel = (CONFIG.shadowExtent * 2) / CONFIG.shadowMapSize;
      const snapped = new THREE.Vector3();

      function follow(center) {
        const r = Math.round(center.dot(right) / texel) * texel;
        const u = Math.round(center.dot(up) / texel) * texel;
        const d = center.dot(SUN_DIRECTION);
        snapped.copy(right).multiplyScalar(r).addScaledVector(up, u).addScaledVector(SUN_DIRECTION, d);
        sun.target.position.copy(snapped);
        sun.position.copy(snapped).addScaledVector(SUN_DIRECTION, 100);
      }

      return { follow };
    }

    class Chunk {
      constructor(cx, cz, materials, assets) {
        this.cx = cx;
        this.cz = cz;
        this.originX = cx * CONFIG.chunkSize;
        this.originZ = cz * CONFIG.chunkSize;
        this.group = new THREE.Group();
        this.group.position.set(this.originX, 0, this.originZ);
        this.detailGroup = new THREE.Group();
        this.group.add(this.detailGroup);
        this.colliders = [];
        this.decorMeshes = [];
        this.shadowMeshes = [];
        this.box = new THREE.Box3();

        const { mesh, minY, maxY } = this.buildTerrain(materials.terrain);
        this.terrain = mesh;
        this.group.add(mesh);
        this.buildDecorations(materials, assets);
        this.box.min.set(this.originX, Math.min(minY, CONFIG.waterLevel) - 1, this.originZ);
        this.box.max.set(this.originX + CONFIG.chunkSize, maxY + 12, this.originZ + CONFIG.chunkSize);
      }

      buildTerrain(material) {
        const seg = CONFIG.chunkSegments;
        const cell = Terrain.cell;
        const stride = seg + 1;
        const heights = new Float32Array(stride * stride);
        let minY = Infinity;
        let maxY = -Infinity;
        for (let j = 0; j <= seg; j++) {
          for (let i = 0; i <= seg; i++) {
            const h = Terrain.sampleHeight(this.originX + i * cell, this.originZ + j * cell);
            heights[j * stride + i] = h;
            minY = Math.min(minY, h);
            maxY = Math.max(maxY, h);
          }
        }

        const positions = new Float32Array(seg * seg * 18);
        const colors = new Float32Array(seg * seg * 18);
        const color = new THREE.Color();
        let offset = 0;

        const addTriangle = (ax, ay, az, bx, by, bz, qx, qy, qz) => {
          const ux = bx - ax, uy = by - ay, uz = bz - az;
          const vx = qx - ax, vy = qy - ay, vz = qz - az;
          const nx = uy * vz - uz * vy;
          const ny = uz * vx - ux * vz;
          const nz = ux * vy - uy * vx;
          Terrain.colorAt(
            this.originX + (ax + bx + qx) / 3,
            this.originZ + (az + bz + qz) / 3,
            (ay + by + qy) / 3,
            ny / Math.hypot(nx, ny, nz),
            color
          );
          positions[offset] = ax; positions[offset + 1] = ay; positions[offset + 2] = az;
          positions[offset + 3] = bx; positions[offset + 4] = by; positions[offset + 5] = bz;
          positions[offset + 6] = qx; positions[offset + 7] = qy; positions[offset + 8] = qz;
          for (let k = 0; k < 3; k++) {
            colors[offset + k * 3] = color.r;
            colors[offset + k * 3 + 1] = color.g;
            colors[offset + k * 3 + 2] = color.b;
          }
          offset += 9;
        };

        for (let j = 0; j < seg; j++) {
          for (let i = 0; i < seg; i++) {
            const x0 = i * cell, x1 = x0 + cell;
            const z0 = j * cell, z1 = z0 + cell;
            const h00 = heights[j * stride + i];
            const h10 = heights[j * stride + i + 1];
            const h01 = heights[(j + 1) * stride + i];
            const h11 = heights[(j + 1) * stride + i + 1];
            addTriangle(x0, h00, z0, x1, h11, z1, x1, h10, z0);
            addTriangle(x0, h00, z0, x0, h01, z1, x1, h11, z1);
          }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, material);
        mesh.receiveShadow = true;
        return { mesh, minY, maxY };
      }

      pickDecor(x, z, height, normalY, roll) {
        const water = CONFIG.waterLevel;
        if (height < water - 0.6) return null;
        if (height < water + 0.5) return roll < 0.35 ? 'reeds' : roll < 0.4 ? 'pebbles' : null;
        if (normalY < 0.78) return roll < 0.1 ? 'rock' : roll < 0.13 ? 'boulder' : null;
        const biome = Terrain.biomeAt(x, z, height);
        const forest = 0.4 + 1.2 * smoothstep(-0.2, 0.6, Terrain.noise(x * 0.008 + 900, z * 0.008 - 300));
        let acc = 0;
        for (const [type, chance] of BIOME_DECOR[biome]) {
          acc += DECOR_TYPES[type].tree ? chance * forest : chance;
          if (roll < acc) return type;
        }
        return null;
      }

      buildDecorations(materials, assets) {
        const rng = mulberry32(hash2(this.cx, this.cz, WORLD_SEED ^ 0x9e3779b9));
        const spacing = CONFIG.decorSpacing;
        const cells = CONFIG.chunkSize / spacing;
        const lists = {};
        const surface = { height: 0, normalY: 1 };

        for (let gj = 0; gj < cells; gj++) {
          for (let gi = 0; gi < cells; gi++) {
            const x = this.originX + (gi + rng()) * spacing;
            const z = this.originZ + (gj + rng()) * spacing;
            const roll = rng();
            const r1 = rng();
            const r2 = rng();
            const r3 = rng();
            const r4 = rng();
            Terrain.surfaceAt(x, z, surface);
            const typeName = this.pickDecor(x, z, surface.height, surface.normalY, roll);
            if (!typeName) continue;
            const type = DECOR_TYPES[typeName];
            const s = type.scale[0] + r1 * (type.scale[1] - type.scale[0]);
            const ry = r2 * Math.PI * 2;
            const shade = 0.86 + r3 * 0.24;
            const tint = type.tint || [1, 1, 1];
            const entry = {
              x, y: surface.height - 0.12, z, rx: 0, ry, rz: 0, sx: s, sy: s * (0.9 + r4 * 0.25), sz: s,
              r: tint[0] * shade * (0.96 + r4 * 0.08), g: tint[1] * shade, b: tint[2] * shade * (0.94 + r1 * 0.08),
            };

            if (type.rock) {
              entry.sx = s * (0.8 + r3 * 0.5);
              entry.sy = s * (0.55 + r4 * 0.45);
              entry.sz = s * (0.8 + r1 * 0.5);
              entry.rx = (r3 - 0.5) * 0.4;
              entry.rz = (r4 - 0.5) * 0.4;
              entry.y = surface.height - 0.25 * entry.sy;
              this.colliders.push({ x, z, radius: Math.max(entry.sx, entry.sz) * 0.85, top: entry.y + entry.sy * 0.85, walkable: true });
            } else if (type.log) {
              entry.sy = s;
              const ax = Math.cos(ry);
              const az = -Math.sin(ry);
              for (const t of [-1.1, 0, 1.1]) {
                this.colliders.push({ x: x + ax * t * s, z: z + az * t * s, radius: 0.34 * s, top: entry.y + 0.58 * s, walkable: true });
              }
            } else if (type.trunk) {
              this.colliders.push({ x, z, radius: type.trunk * s, top: Infinity, walkable: false });
            }

            (lists[type.asset] || (lists[type.asset] = { detail: !!type.detail, entries: [] })).entries.push(entry);
          }
        }

        const matrix = new THREE.Matrix4();
        const position = new THREE.Vector3();
        const quaternion = new THREE.Quaternion();
        const euler = new THREE.Euler();
        const scale = new THREE.Vector3();
        const color = new THREE.Color();

        for (const [assetName, { detail, entries }] of Object.entries(lists)) {
          const mesh = new THREE.InstancedMesh(assets[assetName], materials.decor, entries.length);
          entries.forEach((e, i) => {
            position.set(e.x - this.originX, e.y, e.z - this.originZ);
            quaternion.setFromEuler(euler.set(e.rx, e.ry, e.rz));
            scale.set(e.sx, e.sy, e.sz);
            mesh.setMatrixAt(i, matrix.compose(position, quaternion, scale));
            mesh.setColorAt(i, color.setRGB(e.r, e.g, e.b));
          });
          mesh.instanceMatrix.needsUpdate = true;
          mesh.instanceColor.needsUpdate = true;
          mesh.frustumCulled = false;
          mesh.receiveShadow = true;
          mesh.customDepthMaterial = materials.decorDepth;
          this.decorMeshes.push(mesh);
          if (detail) this.detailGroup.add(mesh);
          else {
            this.shadowMeshes.push(mesh);
            this.group.add(mesh);
          }
        }
      }

      setCastShadow(enabled) {
        for (const mesh of this.shadowMeshes) mesh.castShadow = enabled;
      }

      dispose() {
        this.terrain.geometry.dispose();
        for (const mesh of this.decorMeshes) mesh.dispose();
      }
    }

    class World {
      constructor(scene, materials, assets) {
        this.scene = scene;
        this.materials = materials;
        this.assets = assets;
        this.chunks = new Map();
        this.queue = [];
        this.centerX = null;
        this.centerZ = null;
        this.frustum = new THREE.Frustum();
        this.projScreen = new THREE.Matrix4();
      }

      static key(cx, cz) {
        return cx + ',' + cz;
      }

      chunkCoord(value) {
        return Math.floor(value / CONFIG.chunkSize);
      }

      ringDistance(chunk) {
        return Math.max(Math.abs(chunk.cx - this.centerX), Math.abs(chunk.cz - this.centerZ));
      }

      loadChunk(cx, cz) {
        const chunk = new Chunk(cx, cz, this.materials, this.assets);
        this.chunks.set(World.key(cx, cz), chunk);
        this.applyDistanceSettings(chunk);
        this.scene.add(chunk.group);
      }

      unloadChunk(key, chunk) {
        this.scene.remove(chunk.group);
        chunk.dispose();
        this.chunks.delete(key);
      }

      applyDistanceSettings(chunk) {
        const distance = this.ringDistance(chunk);
        chunk.setCastShadow(distance <= CONFIG.shadowChunkRadius);
        chunk.detailGroup.visible = distance <= CONFIG.detailRadius;
      }

      loadAll(position) {
        this.update(position, new THREE.Vector3());
        while (this.queue.length > 0) {
          const { cx, cz } = this.queue.shift();
          this.loadChunk(cx, cz);
        }
      }

      update(position, velocity) {
        const cx = this.chunkCoord(position.x);
        const cz = this.chunkCoord(position.z);
        if (cx !== this.centerX || cz !== this.centerZ) {
          this.centerX = cx;
          this.centerZ = cz;
          this.refresh(position, velocity);
        }

        let built = 0;
        while (built < CONFIG.chunksPerFrame && this.queue.length > 0) {
          const next = this.queue.shift();
          if (this.chunks.has(World.key(next.cx, next.cz))) continue;
          if (Math.max(Math.abs(next.cx - this.centerX), Math.abs(next.cz - this.centerZ)) > CONFIG.loadRadius) continue;
          this.loadChunk(next.cx, next.cz);
          built++;
        }
      }

      refresh(position, velocity) {
        for (const [key, chunk] of this.chunks) {
          if (this.ringDistance(chunk) > CONFIG.unloadRadius) this.unloadChunk(key, chunk);
          else this.applyDistanceSettings(chunk);
        }

        const lookX = position.x + velocity.x * CONFIG.lookAheadSeconds;
        const lookZ = position.z + velocity.z * CONFIG.lookAheadSeconds;
        const half = CONFIG.chunkSize / 2;
        this.queue = [];
        for (let dz = -CONFIG.loadRadius; dz <= CONFIG.loadRadius; dz++) {
          for (let dx = -CONFIG.loadRadius; dx <= CONFIG.loadRadius; dx++) {
            const cx = this.centerX + dx;
            const cz = this.centerZ + dz;
            if (this.chunks.has(World.key(cx, cz))) continue;
            const mx = cx * CONFIG.chunkSize + half - lookX;
            const mz = cz * CONFIG.chunkSize + half - lookZ;
            this.queue.push({ cx, cz, priority: mx * mx + mz * mz });
          }
        }
        this.queue.sort((a, b) => a.priority - b.priority);
      }

      cull(camera) {
        this.projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
        this.frustum.setFromProjectionMatrix(this.projScreen);
        for (const chunk of this.chunks.values()) {
          const near = this.ringDistance(chunk) <= CONFIG.shadowChunkRadius;
          chunk.group.visible = near || this.frustum.intersectsBox(chunk.box);
        }
      }

      forEachColliderNear(x, z, callback) {
        const cx = this.chunkCoord(x);
        const cz = this.chunkCoord(z);
        for (let dz = -1; dz <= 1; dz++) {
          for (let dx = -1; dx <= 1; dx++) {
            const chunk = this.chunks.get(World.key(cx + dx, cz + dz));
            if (!chunk) continue;
            for (const collider of chunk.colliders) callback(collider);
          }
        }
      }

      groundHeight(x, z, feetY) {
        let ground = Terrain.heightAt(x, z);
        this.forEachColliderNear(x, z, (c) => {
          if (!c.walkable || feetY < c.top - CONFIG.stepUp) return;
          const dx = x - c.x;
          const dz = z - c.z;
          if (dx * dx + dz * dz < c.radius * c.radius * 0.55) ground = Math.max(ground, c.top);
        });
        return ground;
      }

      resolveObstacles(position, velocity, radius) {
        this.forEachColliderNear(position.x, position.z, (c) => {
          if (c.walkable && position.y >= c.top - CONFIG.stepUp) return;
          const dx = position.x - c.x;
          const dz = position.z - c.z;
          const minDistance = c.radius + radius;
          const distSq = dx * dx + dz * dz;
          if (distSq >= minDistance * minDistance) return;
          const dist = Math.sqrt(distSq) || 0.0001;
          const nx = dx / dist;
          const nz = dz / dist;
          position.x = c.x + nx * minDistance;
          position.z = c.z + nz * minDistance;
          const into = velocity.x * nx + velocity.z * nz;
          if (into < 0) {
            velocity.x -= into * nx;
            velocity.z -= into * nz;
          }
        });
      }
    }

    class Butterflies {
      constructor(scene, materials) {
        const wing = new THREE.PlaneGeometry(0.2, 0.15).rotateX(-Math.PI / 2).translate(0.1, 0, 0);
        const body = flatShaded(new THREE.BoxGeometry(0.03, 0.03, 0.14));
        const bodyMaterial = materials.toon(0x2e2a26);
        const wingMaterials = [0xffd23f, 0xff8c42, 0xffffff, 0x8ecae6, 0xe56b9f].map((color) => materials.toon(color, { side: THREE.DoubleSide }));
        const rng = mulberry32(WORLD_SEED ^ 0xb077);
        this.items = [];
        for (let i = 0; i < CONFIG.butterflyCount; i++) {
          const group = new THREE.Group();
          const wingMaterial = wingMaterials[i % wingMaterials.length];
          const left = new THREE.Mesh(wing, wingMaterial);
          const right = new THREE.Mesh(wing, wingMaterial);
          right.scale.x = -1;
          group.add(left, right, new THREE.Mesh(body, bodyMaterial));
          group.visible = false;
          scene.add(group);
          this.items.push({ group, left, right, anchor: new THREE.Vector3(), phase: rng() * 100, speed: 0.7 + rng() * 0.6, active: false, rng });
        }
      }

      respawn(item, center) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const angle = item.rng() * Math.PI * 2;
          const distance = 6 + item.rng() * 30;
          const x = center.x + Math.cos(angle) * distance;
          const z = center.z + Math.sin(angle) * distance;
          const h = Terrain.heightAt(x, z);
          if (h < CONFIG.waterLevel + 0.5) continue;
          const biome = Terrain.biomeAt(x, z, h);
          if (biome === BIOME.MEADOW || biome === BIOME.FOREST || biome === BIOME.SAVANNA) {
            item.anchor.set(x, h, z);
            item.active = true;
            item.group.visible = true;
            return;
          }
        }
        item.active = false;
        item.group.visible = false;
      }

      update(time, dt, center) {
        for (const item of this.items) {
          const dx = item.anchor.x - center.x;
          const dz = item.anchor.z - center.z;
          if (!item.active || dx * dx + dz * dz > 45 * 45) {
            this.respawn(item, center);
            if (!item.active) continue;
          }
          const t = time * item.speed + item.phase;
          item.anchor.x += Math.sin(t * 0.13) * dt * 0.6;
          item.anchor.z += Math.cos(t * 0.11) * dt * 0.6;
          const x = item.anchor.x + Math.sin(t * 0.7) * 2.2 + Math.sin(t * 1.9) * 0.5;
          const z = item.anchor.z + Math.cos(t * 0.6) * 2.2 + Math.cos(t * 1.7) * 0.4;
          const ground = Math.max(Terrain.heightAt(x, z), CONFIG.waterLevel);
          const y = ground + 0.8 + Math.sin(t * 2.3) * 0.35;
          const g = item.group;
          const heading = Math.atan2(x - g.position.x, z - g.position.z);
          if (Number.isFinite(heading)) g.rotation.y = heading;
          g.position.set(x, y, z);
          const flap = 0.15 + (Math.sin(time * 22 + item.phase) * 0.5 + 0.5) * 1.15;
          item.left.rotation.z = flap;
          item.right.rotation.z = -flap;
        }
      }
    }

    class Birds {
      constructor(scene, materials) {
        const wing = new THREE.BufferGeometry();
        wing.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0.18, 0, 0, -0.18, 0.9, 0, -0.1], 3));
        wing.computeVertexNormals();
        const material = materials.toon(0x4a5560, { side: THREE.DoubleSide });
        const bodyGeometry = flatShaded(new THREE.ConeGeometry(0.09, 0.6, 4).rotateX(Math.PI / 2));
        this.flocks = [];
        const rng = mulberry32(WORLD_SEED ^ 0xb1d5);
        for (let f = 0; f < 2; f++) {
          const flock = { center: new THREE.Vector3(), height: 30, radius: 20 + rng() * 15, speed: 0.25 + rng() * 0.15, angle: rng() * 6, birds: [], placed: false, rng };
          for (let i = 0; i < 5; i++) {
            const group = new THREE.Group();
            const left = new THREE.Mesh(wing, material);
            const right = new THREE.Mesh(wing, material);
            right.scale.x = -1;
            group.add(left, right, new THREE.Mesh(bodyGeometry, material));
            scene.add(group);
            flock.birds.push({ group, left, right, offset: new THREE.Vector3((rng() - 0.5) * 6, (rng() - 0.5) * 2, (rng() - 0.5) * 6), phase: rng() * 10 });
          }
          this.flocks.push(flock);
        }
      }

      update(time, dt, center) {
        for (const flock of this.flocks) {
          const dx = flock.center.x - center.x;
          const dz = flock.center.z - center.z;
          if (!flock.placed || dx * dx + dz * dz > 110 * 110) {
            const angle = flock.rng() * Math.PI * 2;
            const distance = 30 + flock.rng() * 40;
            flock.center.set(center.x + Math.cos(angle) * distance, 0, center.z + Math.sin(angle) * distance);
            flock.height = Math.max(Terrain.heightAt(flock.center.x, flock.center.z), CONFIG.waterLevel) + 24 + flock.rng() * 12;
            flock.placed = true;
          }
          flock.angle += flock.speed * dt;
          const cx = flock.center.x + Math.cos(flock.angle) * flock.radius;
          const cz = flock.center.z + Math.sin(flock.angle) * flock.radius;
          const heading = Math.atan2(-Math.sin(flock.angle), Math.cos(flock.angle));
          for (const bird of flock.birds) {
            const g = bird.group;
            g.position.set(cx + bird.offset.x, flock.height + bird.offset.y + Math.sin(time * 0.8 + bird.phase) * 0.6, cz + bird.offset.z);
            g.rotation.y = heading;
            g.rotation.z = -0.25;
            const flap = Math.sin(time * 7 + bird.phase) * 0.55;
            bird.left.rotation.z = flap;
            bird.right.rotation.z = -flap;
          }
        }
      }
    }

    class Clouds {
      constructor(scene, material) {
        const geometries = [11, 23, 37].map((seed) => Models.cloud(seed));
        const rng = mulberry32(WORLD_SEED ^ 0xc10d);
        this.items = [];
        for (let i = 0; i < CONFIG.cloudCount; i++) {
          const mesh = new THREE.Mesh(geometries[i % geometries.length], material);
          mesh.position.set((rng() - 0.5) * 460, 75 + rng() * 30, (rng() - 0.5) * 460);
          mesh.rotation.y = rng() * Math.PI * 2;
          const s = 0.8 + rng() * 0.9;
          mesh.scale.set(s, s, s);
          scene.add(mesh);
          this.items.push(mesh);
        }
      }

      update(dt, center) {
        for (const mesh of this.items) {
          mesh.position.x += dt * 2.5;
          mesh.position.z += dt * 0.8;
          const rx = mesh.position.x - center.x;
          const rz = mesh.position.z - center.z;
          if (rx > 230) mesh.position.x -= 460;
          if (rx < -230) mesh.position.x += 460;
          if (rz > 230) mesh.position.z -= 460;
          if (rz < -230) mesh.position.z += 460;
        }
      }
    }

    function createExplorer(materials) {
      const m = {
        skin: materials.toon(0xf1c29a),
        shirt: materials.toon(0xe3d3a4),
        vest: materials.toon(0x7d8b5a),
        pants: materials.toon(0x8a6a4a),
        boots: materials.toon(0x4a3526),
        hat: materials.toon(0xc8a66a),
        band: materials.toon(0x6b4a2e),
        pack: materials.toon(0x5f7d4a),
        roll: materials.toon(0xb0473c),
        scarf: materials.toon(0xd9573f),
        dark: materials.toon(0x2b2b2b),
        strap: materials.toon(0x5a3d26),
        hair: materials.toon(0x5a3a24),
        metal: materials.toon(0xc9ccd1),
      };
      const meshes = [];
      const add = (parent, geometry, material, x = 0, y = 0, z = 0) => {
        const mesh = new THREE.Mesh(flatShaded(geometry), material);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        parent.add(mesh);
        meshes.push(mesh);
        return mesh;
      };
      const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
      const cyl = (rt, rb, h, s) => new THREE.CylinderGeometry(rt, rb, h, s);
      const pivot = (parent, x, y, z) => {
        const g = new THREE.Group();
        g.position.set(x, y, z);
        parent.add(g);
        return g;
      };

      const root = new THREE.Group();
      const body = pivot(root, 0, 0, 0);
      add(body, box(0.36, 0.2, 0.22), m.pants, 0, 0.95, 0);

      const torso = pivot(body, 0, 1.02, 0);
      add(torso, box(0.38, 0.5, 0.23), m.shirt, 0, 0.25, 0);
      add(torso, box(0.41, 0.36, 0.25), m.vest, 0, 0.2, 0);
      add(torso, box(0.1, 0.12, 0.02), m.vest, 0.12, 0.26, 0.13);
      add(torso, box(0.1, 0.12, 0.02), m.vest, -0.12, 0.26, 0.13);
      add(torso, box(0.43, 0.06, 0.27), m.strap, 0, 0.03, 0);
      add(torso, box(0.07, 0.07, 0.03), m.metal, 0, 0.03, 0.14);
      add(torso, box(0.12, 0.1, 0.1), m.strap, 0.2, 0.0, 0.05);
      add(torso, box(0.3, 0.08, 0.28), m.scarf, 0, 0.51, 0);
      add(torso, box(0.08, 0.22, 0.04), m.scarf, 0.08, 0.4, 0.15).rotation.z = 0.15;
      add(torso, box(0.34, 0.42, 0.17), m.pack, 0, 0.27, -0.2);
      add(torso, box(0.24, 0.15, 0.05), m.pack, 0, 0.14, -0.3);
      add(torso, box(0.05, 0.05, 0.02), m.metal, 0, 0.19, -0.33);
      add(torso, cyl(0.085, 0.085, 0.42, 8).rotateZ(Math.PI / 2), m.roll, 0, 0.54, -0.2);
      add(torso, box(0.05, 0.44, 0.02), m.strap, 0.12, 0.27, 0.13);
      add(torso, box(0.05, 0.44, 0.02), m.strap, -0.12, 0.27, 0.13);
      add(torso, cyl(0.03, 0.03, 0.12, 6), m.metal, -0.19, 0.3, -0.24);

      const head = pivot(torso, 0, 0.56, 0);
      add(head, box(0.1, 0.08, 0.1), m.skin, 0, 0.03, 0);
      add(head, box(0.25, 0.26, 0.24), m.skin, 0, 0.19, 0);
      add(head, box(0.26, 0.12, 0.1), m.hair, 0, 0.24, -0.09);
      add(head, box(0.04, 0.05, 0.02), m.dark, 0.06, 0.21, 0.121);
      add(head, box(0.04, 0.05, 0.02), m.dark, -0.06, 0.21, 0.121);
      add(head, box(0.05, 0.06, 0.05), m.skin, 0, 0.16, 0.13);
      add(head, box(0.08, 0.02, 0.02), m.band, 0, 0.09, 0.121);
      add(head, cyl(0.28, 0.28, 0.03, 12), m.hat, 0, 0.33, 0);
      add(head, cyl(0.14, 0.165, 0.15, 10), m.hat, 0, 0.415, 0);
      add(head, cyl(0.168, 0.168, 0.045, 10), m.band, 0, 0.36, 0);

      const limbs = {};
      for (const side of [1, -1]) {
        const key = side === 1 ? 'L' : 'R';
        const shoulder = pivot(torso, 0.25 * side, 0.44, 0);
        add(shoulder, box(0.13, 0.28, 0.13), m.shirt, 0, -0.13, 0);
        const elbow = pivot(shoulder, 0, -0.27, 0);
        add(elbow, box(0.11, 0.22, 0.11), m.skin, 0, -0.11, 0);
        add(elbow, box(0.12, 0.05, 0.12), m.strap, 0, -0.17, 0);
        add(elbow, box(0.1, 0.1, 0.11), m.skin, 0, -0.26, 0.01);

        const hip = pivot(body, 0.1 * side, 0.9, 0);
        add(hip, box(0.15, 0.42, 0.17), m.pants, 0, -0.21, 0);
        add(hip, box(0.06, 0.12, 0.04), m.strap, 0.07 * side, -0.2, 0);
        const knee = pivot(hip, 0, -0.42, 0);
        add(knee, box(0.14, 0.34, 0.16), m.pants, 0, -0.17, 0);
        add(knee, box(0.16, 0.12, 0.17), m.boots, 0, -0.3, 0);
        add(knee, box(0.16, 0.09, 0.27), m.boots, 0, -0.41, 0.045);
        limbs['shoulder' + key] = shoulder;
        limbs['elbow' + key] = elbow;
        limbs['hip' + key] = hip;
        limbs['knee' + key] = knee;
      }

      root.scale.setScalar(0.92);
      return { root, body, torso, head, ...limbs };
    }

    class ExplorerAnimator {
      constructor(rig) {
        this.rig = rig;
        this.phase = 0;
        this.time = 0;
      }

      set(object, axis, target, dt, speed = 14) {
        object.rotation[axis] = damp(object.rotation[axis], target, speed, dt);
      }

      update(dt, state) {
        const r = this.rig;
        this.time += dt;
        const move = clamp01(state.speed / CONFIG.runSpeed);
        const moving = state.speed > 0.25;
        this.phase += dt * (state.swimming ? 5 : 3 + state.speed * 1.25);
        const s = Math.sin(this.phase);
        const c = Math.cos(this.phase);

        let t = {
          hipL: 0, hipR: 0, kneeL: 0.05, kneeR: 0.05, shoulderL: 0, shoulderR: 0,
          armOutL: 0.08, armOutR: -0.08, elbowL: -0.15, elbowR: -0.15, lean: 0.02, head: 0, bob: 0,
        };

        if (state.swimming) {
          t = {
            ...t,
            hipL: Math.sin(this.phase * 2) * 0.35, hipR: -Math.sin(this.phase * 2) * 0.35, kneeL: 0.3, kneeR: 0.3,
            shoulderL: -1.6 + s * 1.1, shoulderR: -1.6 - s * 1.1, armOutL: 0.35, armOutR: -0.35,
            elbowL: -0.3, elbowR: -0.3, lean: 0.45, head: -0.4, bob: Math.sin(this.phase * 2) * 0.03,
          };
        } else if (!state.grounded) {
          const rising = state.verticalSpeed > 0;
          t = {
            ...t,
            hipL: -0.7, hipR: 0.25, kneeL: 1.0, kneeR: 0.45,
            shoulderL: rising ? -0.9 : -0.4, shoulderR: rising ? 0.5 : -0.3, armOutL: 0.45, armOutR: -0.45,
            elbowL: -0.6, elbowR: -0.4, lean: 0.12, head: -0.08,
          };
        } else if (moving) {
          const amp = 0.35 + move * 0.55;
          t = {
            ...t,
            hipL: -s * amp, hipR: s * amp,
            kneeL: Math.max(0, c) * amp * 1.4 + 0.05, kneeR: Math.max(0, -c) * amp * 1.4 + 0.05,
            shoulderL: s * amp * 0.9, shoulderR: -s * amp * 0.9,
            elbowL: -0.25 - move * 1.0, elbowR: -0.25 - move * 1.0,
            lean: 0.04 + move * 0.22, head: -(0.04 + move * 0.22) * 0.6,
            bob: Math.abs(s) * 0.05 * amp,
          };
        } else {
          const breath = Math.sin(this.time * 1.6);
          t.lean = 0.02 + breath * 0.012;
          t.shoulderL = breath * 0.03;
          t.shoulderR = -breath * 0.03;
        }

        const k = state.grounded || state.swimming ? 16 : 10;
        this.set(r.hipL, 'x', t.hipL, dt, k);
        this.set(r.hipR, 'x', t.hipR, dt, k);
        this.set(r.kneeL, 'x', t.kneeL, dt, k);
        this.set(r.kneeR, 'x', t.kneeR, dt, k);
        this.set(r.shoulderL, 'x', t.shoulderL, dt, k);
        this.set(r.shoulderR, 'x', t.shoulderR, dt, k);
        this.set(r.shoulderL, 'z', t.armOutL, dt, k);
        this.set(r.shoulderR, 'z', t.armOutR, dt, k);
        this.set(r.elbowL, 'x', t.elbowL, dt, k);
        this.set(r.elbowR, 'x', t.elbowR, dt, k);
        this.set(r.torso, 'x', t.lean, dt, 8);
        this.set(r.head, 'x', t.head, dt, 8);
        r.body.position.y = damp(r.body.position.y, t.bob, 20, dt);
      }
    }

    class Input {
      constructor() {
        this.keys = new Set();
        this.jumpQueued = false;
        const handled = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight', 'Space']);
        window.addEventListener('keydown', (e) => {
          if (!handled.has(e.code)) return;
          e.preventDefault();
          if (e.code === 'Space' && !e.repeat) this.jumpQueued = true;
          this.keys.add(e.code);
        });
        window.addEventListener('keyup', (e) => this.keys.delete(e.code));
        window.addEventListener('blur', () => this.keys.clear());
      }

      axis() {
        const x = (this.keys.has('KeyD') ? 1 : 0) - (this.keys.has('KeyA') ? 1 : 0);
        const z = (this.keys.has('KeyS') ? 1 : 0) - (this.keys.has('KeyW') ? 1 : 0);
        return { x, z };
      }

      get running() {
        return this.keys.has('ShiftLeft') || this.keys.has('ShiftRight');
      }

      consumeJump() {
        const queued = this.jumpQueued;
        this.jumpQueued = false;
        return queued;
      }
    }

    class Player {
      constructor(materials) {
        this.position = new THREE.Vector3();
        this.previousPosition = new THREE.Vector3();
        this.renderPosition = new THREE.Vector3();
        this.velocity = new THREE.Vector3();
        this.grounded = false;
        this.swimming = false;
        this.timeSinceGrounded = 0;
        this.jumpBufferTimer = 0;
        this.hasJumped = false;
        this.facing = 0;
        this.squash = 0;

        this.rig = createExplorer(materials);
        this.animator = new ExplorerAnimator(this.rig);
        this.pivot = new THREE.Group();
        this.pivot.add(this.rig.root);
        this.mesh = new THREE.Group();
        this.mesh.add(this.pivot);
      }

      spawn(x, z) {
        const ground = Math.max(Terrain.heightAt(x, z), CONFIG.waterLevel - CONFIG.swimDepth);
        this.position.set(x, ground + 0.05, z);
        this.previousPosition.copy(this.position);
        this.renderPosition.copy(this.position);
        this.velocity.set(0, 0, 0);
      }

      fixedUpdate(dt, input, cameraYaw, world) {
        this.previousPosition.copy(this.position);

        const { x: ix, z: iz } = input.axis();
        let wishX = Math.cos(cameraYaw) * ix + Math.sin(cameraYaw) * iz;
        let wishZ = -Math.sin(cameraYaw) * ix + Math.cos(cameraYaw) * iz;
        const wishLength = Math.hypot(wishX, wishZ);
        let targetSpeed = 0;
        if (wishLength > 0) {
          wishX /= wishLength;
          wishZ /= wishLength;
          targetSpeed = input.running ? CONFIG.runSpeed : CONFIG.walkSpeed;
          const terrainHere = Terrain.heightAt(this.position.x, this.position.z);
          if (this.grounded && !this.swimming) {
            const grade = (Terrain.heightAt(this.position.x + wishX * 0.5, this.position.z + wishZ * 0.5) - terrainHere) / 0.5;
            targetSpeed *= Math.min(1, Math.max(0.35, 1 - (grade - 0.6) * 0.8));
          }
          const depth = CONFIG.waterLevel - terrainHere;
          if (depth > 0.3) targetSpeed *= 1 - (1 - CONFIG.swimSpeedFactor) * clamp01((depth - 0.3) / 0.9);
        }

        const accel = (this.grounded ? CONFIG.groundAccel : CONFIG.airAccel) * dt;
        const dvx = wishX * targetSpeed - this.velocity.x;
        const dvz = wishZ * targetSpeed - this.velocity.z;
        const dvLength = Math.hypot(dvx, dvz);
        if (dvLength <= accel) {
          this.velocity.x += dvx;
          this.velocity.z += dvz;
        } else {
          this.velocity.x += (dvx / dvLength) * accel;
          this.velocity.z += (dvz / dvLength) * accel;
        }

        if (input.consumeJump()) this.jumpBufferTimer = CONFIG.jumpBufferTime;
        else this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - dt);
        const canJump = !this.hasJumped && (this.grounded || this.timeSinceGrounded < CONFIG.coyoteTime);
        if (this.jumpBufferTimer > 0 && canJump) {
          this.velocity.y = CONFIG.jumpSpeed * (this.swimming ? 0.75 : 1);
          this.grounded = false;
          this.swimming = false;
          this.hasJumped = true;
          this.jumpBufferTimer = 0;
        }

        const wasGrounded = this.grounded;
        this.velocity.y -= CONFIG.gravity * dt;
        this.position.addScaledVector(this.velocity, dt);
        world.resolveObstacles(this.position, this.velocity, CONFIG.playerRadius);

        const solidY = world.groundHeight(this.position.x, this.position.z, this.position.y);
        const swimY = CONFIG.waterLevel - CONFIG.swimDepth;
        const supportY = Math.max(solidY, swimY);
        const onWater = swimY > solidY;
        if (this.position.y <= supportY) {
          const impact = -this.velocity.y;
          this.position.y = supportY;
          if (this.velocity.y < 0) this.velocity.y = 0;
          if (!wasGrounded && !onWater) this.squash = Math.max(this.squash, Math.min(0.28, impact * 0.022));
          this.grounded = true;
        } else if (wasGrounded && this.velocity.y <= 0 && this.position.y - supportY < CONFIG.groundSnap) {
          this.position.y = supportY;
          this.velocity.y = 0;
          this.grounded = true;
        } else {
          this.grounded = false;
        }
        this.swimming = this.grounded && onWater;

        if (this.grounded) {
          this.timeSinceGrounded = 0;
          this.hasJumped = false;
        } else {
          this.timeSinceGrounded += dt;
        }
      }

      render(alpha, dt) {
        this.renderPosition.lerpVectors(this.previousPosition, this.position, alpha);
        this.mesh.position.copy(this.renderPosition);

        const speed = Math.hypot(this.velocity.x, this.velocity.z);
        if (speed > 0.3) {
          const target = Math.atan2(this.velocity.x, this.velocity.z);
          let delta = target - this.facing;
          delta = Math.atan2(Math.sin(delta), Math.cos(delta));
          this.facing += delta * (1 - Math.exp(-12 * dt));
        }
        this.mesh.rotation.y = this.facing;

        this.squash = damp(this.squash, 0, 10, dt);
        const sy = 1 - this.squash;
        const sxz = 1 / Math.sqrt(sy);
        this.pivot.scale.set(sxz, sy, sxz);

        this.animator.update(dt, { speed, grounded: this.grounded, swimming: this.swimming, verticalSpeed: this.velocity.y });
      }
    }

    class CameraRig {
      constructor(camera, domElement, hint) {
        this.camera = camera;
        this.domElement = domElement;
        this.yaw = 0;
        this.pitch = 0.3;
        this.distance = 6.5;
        this.currentDistance = 6.5;
        this.focus = new THREE.Vector3();
        this.direction = new THREE.Vector3();
        this.probe = new THREE.Vector3();
        this.pointers = new Map();
        this.pinchDistance = 0;
        this.coarse = window.matchMedia('(pointer: coarse)').matches;

        const updateHint = () => {
          hint.hidden = this.coarse || this.locked;
        };
        updateHint();
        document.addEventListener('pointerlockchange', updateHint);

        domElement.addEventListener('click', () => {
          if (this.coarse || this.locked) return;
          try {
            const request = domElement.requestPointerLock();
            if (request && request.catch) request.catch(() => {});
          } catch (error) {}
        });
        document.addEventListener('mousemove', (e) => {
          if (!this.locked) return;
          const dx = Math.max(-200, Math.min(200, e.movementX));
          const dy = Math.max(-200, Math.min(200, e.movementY));
          this.rotate(dx * CONFIG.mouseSensitivity, dy * CONFIG.mouseSensitivity);
        });

        domElement.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse') return;
          domElement.setPointerCapture(e.pointerId);
          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (this.pointers.size === 2) this.pinchDistance = this.pointerSpread();
        });
        domElement.addEventListener('pointermove', (e) => {
          const last = this.pointers.get(e.pointerId);
          if (!last) return;
          if (this.pointers.size === 1) this.rotate((e.clientX - last.x) * 0.005, (e.clientY - last.y) * 0.004);
          last.x = e.clientX;
          last.y = e.clientY;
          if (this.pointers.size === 2) {
            const spread = this.pointerSpread();
            if (this.pinchDistance > 0) this.zoom(this.pinchDistance / spread);
            this.pinchDistance = spread;
          }
        });
        const release = (e) => {
          this.pointers.delete(e.pointerId);
          this.pinchDistance = 0;
        };
        domElement.addEventListener('pointerup', release);
        domElement.addEventListener('pointercancel', release);
        domElement.addEventListener('contextmenu', (e) => e.preventDefault());
        domElement.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.zoom(Math.exp(e.deltaY * 0.001));
        }, { passive: false });
      }

      get locked() {
        return document.pointerLockElement === this.domElement;
      }

      rotate(dYaw, dPitch) {
        this.yaw -= dYaw;
        this.pitch = Math.min(CONFIG.camMaxPitch, Math.max(CONFIG.camMinPitch, this.pitch + dPitch));
      }

      pointerSpread() {
        const [a, b] = [...this.pointers.values()];
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      zoom(factor) {
        this.distance = Math.min(CONFIG.camMaxDistance, Math.max(CONFIG.camMinDistance, this.distance * factor));
      }

      snapTo(target) {
        this.focus.set(target.x, target.y + CONFIG.camFocusHeight, target.z);
      }

      floorAt(x, z) {
        return Math.max(Terrain.heightAt(x, z), CONFIG.waterLevel) + CONFIG.camClearance;
      }

      update(dt, target) {
        this.focus.x = damp(this.focus.x, target.x, 14, dt);
        this.focus.z = damp(this.focus.z, target.z, 14, dt);
        this.focus.y = damp(this.focus.y, target.y + CONFIG.camFocusHeight, 8, dt);

        const cosPitch = Math.cos(this.pitch);
        this.direction.set(Math.sin(this.yaw) * cosPitch, Math.sin(this.pitch), Math.cos(this.yaw) * cosPitch);

        let allowed = this.distance;
        const steps = 28;
        for (let i = 1; i <= steps; i++) {
          const d = (this.distance * i) / steps;
          this.probe.copy(this.focus).addScaledVector(this.direction, d);
          if (this.probe.y < this.floorAt(this.probe.x, this.probe.z)) {
            allowed = Math.max(0.6, d - this.distance / steps);
            break;
          }
        }
        this.currentDistance = allowed < this.currentDistance ? allowed : damp(this.currentDistance, allowed, 4, dt);

        const position = this.camera.position.copy(this.focus).addScaledVector(this.direction, this.currentDistance);
        const floor = this.floorAt(position.x, position.z);
        if (position.y < floor) position.y = floor;
        this.camera.lookAt(this.focus);
      }
    }

    function createRenderer() {
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.body.appendChild(renderer.domElement);
      return renderer;
    }

    const renderer = createRenderer();
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xfff3dc, CONFIG.fogNear, CONFIG.fogFar);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);

    const materials = createMaterials(createGradientMap(renderer));
    const sky = createSky();
    scene.add(sky);
    const sunlight = createLights(scene);
    const water = createWater(materials.water);
    scene.add(water.mesh);
    const world = new World(scene, materials, createDecorAssets());
    const input = new Input();
    const player = new Player(materials);
    scene.add(player.mesh);
    const cameraRig = new CameraRig(camera, renderer.domElement, document.getElementById('hint'));
    const butterflies = new Butterflies(scene, materials);
    const birds = new Birds(scene, materials);
    const clouds = new Clouds(scene, materials.cloud);

    player.spawn(0, 0);
    world.loadAll(player.position);
    cameraRig.snapTo(player.position);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let accumulator = 0;
    let elapsed = 0;

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.1);
      elapsed += dt;
      wind.value = elapsed;
      accumulator += dt;
      while (accumulator >= CONFIG.physicsStep) {
        player.fixedUpdate(CONFIG.physicsStep, input, cameraRig.yaw, world);
        accumulator -= CONFIG.physicsStep;
      }
      player.render(accumulator / CONFIG.physicsStep, dt);
      world.update(player.position, player.velocity);
      cameraRig.update(dt, player.renderPosition);
      sunlight.follow(player.renderPosition);
      water.follow(player.renderPosition);
      butterflies.update(elapsed, dt, player.renderPosition);
      birds.update(elapsed, dt, player.renderPosition);
      clouds.update(dt, player.renderPosition);
      sky.position.copy(camera.position);
      camera.updateMatrixWorld();
      world.cull(camera);
      renderer.render(scene, camera);
    }
    frame();
  </script>
</body>
</html>
